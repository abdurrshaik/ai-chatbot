<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>AI Chatbot</title>
<link rel="stylesheet" href="./style.css">
```

</head>

<body>
<div class="app">

```
<aside class="sidebar">
    <div class="logo">🤖 AI Chatbot</div>

    <button type="button" class="new-chat" id="newChatBtn">
        + New Chat
    </button>

    <p>Your AI assistant</p>
</aside>

<main class="main">

    <header class="header">
        <button
            type="button"
            class="sidebar-toggle"
            id="sidebarToggle"
            aria-label="Toggle sidebar"
            aria-expanded="true"
        >☰</button>

        <span>AI Assistant</span>
    </header>

    <section class="messages" id="messages">
        <div class="welcome" id="welcome">
            <h1>Welcome to AI Chatbot</h1>
            <p>Ask a question to get started.</p>
        </div>
    </section>

    <footer class="input-area">

        <form class="chat-form" id="chatForm">

            <!-- Attachment button and menu -->
            <div class="attachment-wrapper">

                <button
                    type="button"
                    class="attach-button"
                    id="attachBtn"
                    aria-label="Add attachments"
                    aria-expanded="false"
                >+</button>

                <div
                    class="attachment-menu"
                    id="attachmentMenu"
                    hidden
                >
                    <button type="button" id="cameraOption">
                        📷 Camera
                    </button>

                    <button type="button" id="photosOption">
                        🖼️ Photos
                    </button>

                    <button type="button" id="filesOption">
                        📁 Files
                    </button>
                </div>

            </div>

            <!-- Camera input -->
            <input
                type="file"
                id="cameraInput"
                accept="image/*"
                capture="environment"
                hidden
            >

            <!-- Photo gallery input -->
            <input
                type="file"
                id="photosInput"
                accept="image/*"
                multiple
                hidden
            >

            <!-- File picker input -->
            <input
                type="file"
                id="filesInput"
                multiple
                hidden
            >

            <!-- Message box -->
            <textarea
                class="chat-input"
                id="userInput"
                placeholder="Ask me anything..."
                autocomplete="off"
                rows="1"
                required
            ></textarea>

            <!-- Send button -->
            <button type="submit" class="send-button">
                Send
            </button>

        </form>

        <p class="disclaimer">
            AI can make mistakes. Check important information.
        </p>

    </footer>

</main>
```

</div>

<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>

<script src="./script.js"></script>

</body>
</html>
