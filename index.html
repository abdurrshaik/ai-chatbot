<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<meta name="theme-color" content="#10172a">
<meta name="description" content="AI Chatbot — your personal AI assistant.">

<!-- Paste your exact Google verification tag below -->
<meta name="google-site-verification" content="YOUR_UNIQUE_CODE">

<title>AI Chatbot</title>

<!-- Website styling -->
<link rel="stylesheet" href="./style.css">

<!-- Neon Ribbon Robot Icon for the browser tab -->
<link rel="icon" type="image/png" sizes="512x512" href="./chatbot-logo.png?v=2">
<link rel="shortcut icon" type="image/png" href="./chatbot-logo.png?v=2">

<!-- Mobile home-screen icon -->
<link rel="apple-touch-icon" href="./chatbot-logo.png?v=2">
<link rel="manifest" href="./manifest.json">


</head>

<body>
<div class="app">


<!-- Sidebar -->
<aside class="sidebar">

    <!-- Logo beside AI Chatbot -->
    <div class="logo">
        <img
            src="./chatbot-logo.png?v=2"
            alt="AI Chatbot logo"
            class="logo-image"
            onerror="this.style.display='none'; this.nextElementSibling.textContent='🤖 AI Chatbot';"
        >
        <span>AI Chatbot</span>
    </div>

    <button type="button" class="new-chat" id="newChatBtn">
        + New Chat
    </button>

    <p>Your AI Assistant</p>

</aside>

<!-- Main chat area -->
<main class="main">

    <!-- Header -->
    <header class="header">

        <button
            type="button"
            class="sidebar-toggle"
            id="sidebarToggle"
            aria-label="Toggle sidebar"
            aria-expanded="true"
        >☰</button>

        <span>AI Chatbot</span>

    </header>

    <!-- Messages -->
    <section class="messages" id="messages">

        <div class="welcome" id="welcome">
            <h1>Welcome to AI Chatbot</h1>
            <p>Ask a question to get started.</p>
        </div>

    </section>

    <!-- Input area -->
    <footer class="input-area">

        <form class="chat-form" id="chatForm">

            <!-- Attachment button and menu -->
            <div class="attachment-wrapper">

                <button
                    type="button"
                    class="attach-button"
                    id="attachBtn"
                    aria-label="Add attachments"
                    aria-expanded="false"
                >+</button>

                <div
                    class="attachment-menu"
                    id="attachmentMenu"
                    hidden
                >
                    <button type="button" id="cameraOption">
                        📷 Camera
                    </button>

                    <button type="button" id="photosOption">
                        🖼️ Photos
                    </button>

                    <button type="button" id="filesOption">
                        📁 Files
                    </button>
                </div>

            </div>

            <!-- Camera input -->
            <input
                type="file"
                id="cameraInput"
                accept="image/*"
                capture="environment"
                hidden
            >

            <!-- Photo gallery input -->
            <input
                type="file"
                id="photosInput"
                accept="image/*"
                multiple
                hidden
            >

            <!-- File picker input -->
            <input
                type="file"
                id="filesInput"
                multiple
                hidden
            >

            <!-- Message box -->
            <textarea
                class="chat-input"
                id="userInput"
                placeholder="Ask me anything..."
                autocomplete="off"
                rows="1"
                required
            ></textarea>

            <!-- Send button -->
            <button type="submit" class="send-button">
                Send
            </button>

        </form>

        <p class="disclaimer">
            AI can make mistakes. Check important information.
        </p>

    </footer>

</main>


</div>

<!-- Markdown and HTML sanitization -->

<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>

<!-- Chatbot functionality -->

<script src="./script.js"></script>

</body>
</html>
